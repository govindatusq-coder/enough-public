name: Load Bear iPhone app
# Builds the Load Bear iPhone app (native-loadbear) on a Mac build machine.
# - On main it signs the app and uploads it to TestFlight, so a new build reaches the TestFlight app
#   on its own. It runs when the app itself changes (icon, permissions, share add-on). The app opens
#   the live website, so website changes never need a new build.
# - On other branches it only checks that the app still builds (no signing, no upload).
# - "Run workflow" on main uploads a fresh build by hand.
# Signing and upload use an App Store Connect API key kept in this repository's Actions secrets
# (never in the code): APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_PRIVATE_KEY (the whole .p8 file, including the BEGIN and END lines) and APPLE_TEAM_ID.
# Without them, main builds are checked but not uploaded.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['native-loadbear/**', '.github/workflows/loadbear-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loadbear-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native-loadbear
    env:
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
      HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native-loadbear/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - name: Point the app at the live site
        run: node configure.mjs && npx cap sync ios

      - name: Check the app builds (no signing)
        if: env.ON_MAIN != 'true' || env.HAS_KEY != 'true'
        run: |
          if [ "$ON_MAIN" = "true" ]; then echo "::warning::TestFlight upload is off: add the App Store Connect key to this repository's Actions secrets (see the top of this workflow)."; fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
          echo "The app and its share add-on build." >> "$GITHUB_STEP_SUMMARY"

      - name: Sign and upload to TestFlight
        if: env.ON_MAIN == 'true' && env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY")
          # Year.monthday.time (UTC): always higher than the build before, whoever uploaded it.
          BUILD="$(date -u +%Y).$((10#$(date -u +%m%d))).$((10#$(date -u +%H%M)))"
          echo "Build number $BUILD"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LoadBear.xcarchive" \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" -quiet archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LoadBear.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "Uploaded Load Bear build $BUILD to TestFlight. It shows in the TestFlight app once Apple has processed it (usually 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"
