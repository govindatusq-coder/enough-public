# Delivers due Load Bear reminders by push every 15 minutes (Vercel's own cron runs once a day on the Hobby plan).
# No secrets are needed (owner-approved): the route only sends reminders that are already due, once, and ignores repeat calls.
name: Bear reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder delivery route
        run: |
          curl --fail --silent --show-error --max-time 150 \
            "https://enough-public-zuue.vercel.app/api/bear/cron/reminders"
